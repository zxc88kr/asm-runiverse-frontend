# 운영 앱(com.runiverse.app)을 빌드해 Play 내부 테스트 트랙과 TestFlight에 올린다.
# 스토어 공개는 여기서 하지 않는다 — Play 승급·iOS 심사 제출과 게시·출시는 사람이 한다(docs/release.md).
name: Prod Release

on:
  push:
    branches:
      - main # dev→main PR이 머지되면 돈다
  workflow_dispatch: # Actions 화면의 Run workflow 버튼. 브랜치는 main을 고른다

concurrency:
  group: prod-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  PACKAGE_NAME: com.runiverse.app
  PROD_API_BASE_URL: https://api.runiverseapp.com

jobs:
  prepare:
    name: 준비
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.version.outputs.code }}
      name: ${{ steps.name.outputs.name }}
      commit: ${{ steps.version.outputs.commit }}
      sha: ${{ steps.version.outputs.sha }}
      flutter: ${{ steps.version.outputs.flutter }}
    steps:
      - name: main 브랜치인지 확인
        run: |
          # 다른 브랜치에서 누르면 그 브랜치 코드가 운영 앱으로 나간다
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::main 브랜치에서만 실행한다 ($GITHUB_REF_NAME)"
            exit 1
          fi

      # 직전 main(머지 커밋의 첫 부모)과 버전 이름을 비교하려고 두 커밋을 받는다
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: 버전 이름 확인
        id: name
        run: |
          set -euo pipefail
          # `version: 1.0.0 # 주석`에서 이름만 꺼낸다
          read_version() { sed -n 's/^version:[[:space:]]*\([^[:space:]#]*\).*/\1/p' | head -1; }
          # 서버(app_versions·X-App-Version)와 같은 형식이다. 서버는 형식이 틀린 헤더를 통과시키므로 여기서 막는다
          FORMAT='^[0-9]{1,9}\.[0-9]{1,9}\.[0-9]{1,9}$'

          NAME=$(read_version < pubspec.yaml)
          [[ "$NAME" =~ $FORMAT ]] || { echo "::error::pubspec.yaml 버전 이름이 x.y.z가 아니다 ($NAME)"; exit 1; }

          git rev-parse --verify --quiet HEAD^1 > /dev/null || { echo "::error::직전 main 커밋을 받지 못했다"; exit 1; }
          if git cat-file -e HEAD^1:pubspec.yaml 2>/dev/null; then
            PREV=$(git show HEAD^1:pubspec.yaml | read_version)
            [[ "$PREV" =~ $FORMAT ]] || { echo "::error::직전 main의 버전 이름이 x.y.z가 아니다 ($PREV)"; exit 1; }
            # 서버와 같이 부분별 정수로 비교한다(문자열 비교면 1.10.0 < 1.9.0). 10#은 앞자리 0을 8진수로 읽지 않게 한다
            IFS=. read -ra NEW <<< "$NAME"
            IFS=. read -ra OLD <<< "$PREV"
            NEWER=false
            for i in 0 1 2; do
              if (( 10#${NEW[i]} > 10#${OLD[i]} )); then NEWER=true; break; fi
              if (( 10#${NEW[i]} < 10#${OLD[i]} )); then break; fi
            done
            [ "$NEWER" = true ] || { echo "::error::버전 이름을 올리지 않았다 ($PREV → $NAME). dev→main PR 전에 pubspec.yaml을 올린다"; exit 1; }
          else
            echo "::notice::직전 main에 pubspec.yaml이 없어 버전 비교를 건너뛴다(첫 운영 실행)"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: 버전 코드 정하기
        id: version
        run: |
          # 실행 번호를 그대로 쓴다
          # 두 플랫폼이 같은 커밋을 빌드하도록 여기서 정한 커밋을 넘긴다
          {
            echo "code=${{ github.run_number }}"
            echo "commit=$(git rev-parse HEAD)"
            echo "sha=$(git rev-parse --short HEAD)"
            echo "flutter=$(jq -r .flutter .fvmrc)"
          } >> "$GITHUB_OUTPUT"

  check:
    name: 검사
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.prepare.outputs.flutter }}
          channel: stable
          cache: true

      # 폴더를 정해 준다. pub get이 build/ios/SourcePackages에 플러그인 사본을 만들어, 통째로 돌리면 그것까지 검사해 실패한다
      - name: Analyze
        run: flutter analyze lib test integration_test

      - name: Test
        env:
          TZ: Asia/Seoul # 테스트는 사용자 기기와 같은 시간대로 돈다
        run: flutter test

  android:
    name: Android 배포
    needs: [prepare, check] # 검사가 실패하면 올리지 않는다
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: prod # Secret·Variable은 prod 환경에 있다. 이름은 dev 환경과 같다
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle # Gradle 설정 파일이 바뀔 때만 새로 저장한다

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.prepare.outputs.flutter }}
          channel: stable
          cache: true

      - name: 설정·서명 파일 만들기
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          NAVER_MAP_CLIENT_ID: ${{ secrets.NAVER_MAP_CLIENT_ID }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_CLIENT_TOKEN: ${{ secrets.META_CLIENT_TOKEN }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KAKAO_NATIVE_APP_KEY NAVER_MAP_CLIENT_ID GOOGLE_SERVER_CLIENT_ID GOOGLE_SERVICES_JSON META_APP_ID META_CLIENT_TOKEN API_BASE_URL; do
            if [ -z "${!name}" ]; then echo "::error::$name이 비어 있다"; exit 1; fi
          done
          [ "$API_BASE_URL" = "$PROD_API_BASE_URL" ] || { echo "::error::API_BASE_URL이 운영 주소가 아니다 ($API_BASE_URL)"; exit 1; }

          # key.properties가 없으면 prod flavor가 debug 키로 서명된다. 아래 지문 검사가 그것도 잡는다
          KEYSTORE="$RUNNER_TEMP/upload-keystore.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          cat > android/key.properties <<EOF
          storeFile=$KEYSTORE
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          keyPassword=$KEYSTORE_PASSWORD
          EOF

          jq -n \
            --arg api "$API_BASE_URL" \
            --arg naver "$NAVER_MAP_CLIENT_ID" \
            --arg kakao "$KAKAO_NATIVE_APP_KEY" \
            --arg google "$GOOGLE_SERVER_CLIENT_ID" \
            --arg meta "$META_APP_ID" \
            '{API_BASE_URL: $api, NAVER_MAP_CLIENT_ID: $naver, KAKAO_NATIVE_APP_KEY: $kakao, GOOGLE_SERVER_CLIENT_ID: $google, META_APP_ID: $meta}' \
            > config/prod.json

          # Firebase(runiverse) 설정. prod flavor만 읽는 자리에 둔다
          mkdir -p android/app/src/prod
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/src/prod/google-services.json

      - name: Build app bundle
        env:
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_CLIENT_TOKEN: ${{ secrets.META_CLIENT_TOKEN }}
        run: |
          flutter build appbundle --release --flavor prod \
            --build-number=${{ needs.prepare.outputs.code }} \
            --dart-define-from-file=config/prod.json \
            -PKAKAO_NATIVE_APP_KEY="$KAKAO_NATIVE_APP_KEY" \
            -PMETA_APP_ID="$META_APP_ID" \
            -PMETA_CLIENT_TOKEN="$META_CLIENT_TOKEN"

      - name: 산출물 검증
        env:
          UPLOAD_CERT_SHA1: ${{ vars.UPLOAD_CERT_SHA1 }} # 운영 업로드 키의 공개 지문. 다른 키로 서명됐으면 멈춘다
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_CLIENT_TOKEN: ${{ secrets.META_CLIENT_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$UPLOAD_CERT_SHA1" ] || { echo "::error::UPLOAD_CERT_SHA1이 비어 있다"; exit 1; }
          AAB=build/app/outputs/bundle/prodRelease/app-prod-release.aab
          MANIFEST=$(find build/app/intermediates/merged_manifest/prodRelease -name AndroidManifest.xml | head -1)

          grep -q "package=\"$PACKAGE_NAME\"" "$MANIFEST" || { echo "::error::패키지가 $PACKAGE_NAME이 아니다"; exit 1; }
          if grep -q 'android:debuggable="true"' "$MANIFEST"; then echo "::error::debuggable 빌드다"; exit 1; fi
          # Meta 값은 -P로 따로 들어간다. 빠지면 앱은 조용히 Meta 없이 돌아 광고 설치 측정이 꺼진다
          grep -qF "android:value=\"fb$META_APP_ID\"" "$MANIFEST" || { echo "::error::Meta 앱 ID가 매니페스트에 없다"; exit 1; }
          grep -qF "android:value=\"$META_CLIENT_TOKEN\"" "$MANIFEST" || { echo "::error::Meta 클라이언트 토큰이 매니페스트에 없다"; exit 1; }

          SHA1=$(keytool -printcert -jarfile "$AAB" | awk '/SHA1:/ && !found {print $2; found=1}')
          [ "$SHA1" = "$UPLOAD_CERT_SHA1" ] || { echo "::error::운영 업로드 키로 서명되지 않았다 ($SHA1)"; exit 1; }

          unzip -q -o "$AAB" 'base/lib/arm64-v8a/libapp.so' -d "$RUNNER_TEMP/aab"
          # 파일로 받아 검사한다. pipefail에서 `strings | grep -q`는 grep이 먼저 끝나 SIGPIPE(141)로 실패한다
          STRINGS="$RUNNER_TEMP/libapp-strings.txt"
          strings "$RUNNER_TEMP/aab/base/lib/arm64-v8a/libapp.so" > "$STRINGS"
          grep -qF "$PROD_API_BASE_URL" "$STRINGS" || { echo "::error::운영 서버 주소가 앱에 없다"; exit 1; }

      # 내부 테스트는 심사 없이 바로 팀원에게 간다. 프로덕션 승급은 Play Console에서 사람이 한다
      - name: Upload to Play internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          releaseName: ${{ needs.prepare.outputs.code }} (${{ needs.prepare.outputs.name }} ${{ needs.prepare.outputs.sha }})
          tracks: internal
          status: completed

  ios:
    name: iOS 배포
    needs: [prepare, check]
    runs-on: macos-26 # App Store는 Xcode 26(iOS 26 SDK) 이상으로 빌드한 앱만 받는다
    timeout-minutes: 60
    environment: prod
    env:
      TEAM_ID: L3W3PJTF9B
      ARCHIVE: build/ios/archive/Runner.xcarchive
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.prepare.outputs.flutter }}
          channel: stable
          cache: true

      # flutter build ipa가 Xcode에 SPM 패키지 자리로 넘기는 폴더다(-clonedSourcePackagesDirPath)
      # 플러그인 사본은 pub get이 다시 만들어 받은 패키지와 상태 파일만 둔다. lock이 바뀌면 옛 캐시에서 바뀐 것만 받는다
      - name: SPM 패키지 캐시
        uses: actions/cache@v5
        with:
          path: |
            build/ios/SourcePackages/artifacts
            build/ios/SourcePackages/checkouts
            build/ios/SourcePackages/repositories
            build/ios/SourcePackages/workspace-state.json
          key: spm-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: spm-${{ runner.os }}-

      - name: 설정·서명 파일 만들기
        env:
          DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          NAVER_MAP_CLIENT_ID: ${{ secrets.NAVER_MAP_CLIENT_ID }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_CLIENT_TOKEN: ${{ secrets.META_CLIENT_TOKEN }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          for name in DIST_CERT_BASE64 DIST_CERT_PASSWORD PROFILE_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 KAKAO_NATIVE_APP_KEY NAVER_MAP_CLIENT_ID GOOGLE_SERVER_CLIENT_ID GOOGLE_IOS_CLIENT_ID GOOGLE_SERVICE_INFO_PLIST META_APP_ID META_CLIENT_TOKEN API_BASE_URL; do
            if [ -z "${!name}" ]; then echo "::error::$name이 비어 있다"; exit 1; fi
          done
          [ "$API_BASE_URL" = "$PROD_API_BASE_URL" ] || { echo "::error::API_BASE_URL이 운영 주소가 아니다 ($API_BASE_URL)"; exit 1; }
          # 구글 로그인은 iOS 클라이언트와 서버 클라이언트가 같은 OAuth 프로젝트여야 한다. 클라이언트 ID 앞자리가 프로젝트 번호다
          [ "${GOOGLE_IOS_CLIENT_ID%%-*}" = "${GOOGLE_SERVER_CLIENT_ID%%-*}" ] || { echo "::error::구글 iOS·서버 클라이언트 ID의 프로젝트가 다르다"; exit 1; }

          # iOS는 Meta 토큰도 여기로 넘긴다. 빌드 단계 스크립트가 DART_DEFINES에서 읽어 Info.plist에 넣는다
          jq -n \
            --arg api "$API_BASE_URL" \
            --arg naver "$NAVER_MAP_CLIENT_ID" \
            --arg kakao "$KAKAO_NATIVE_APP_KEY" \
            --arg google "$GOOGLE_SERVER_CLIENT_ID" \
            --arg googleIos "$GOOGLE_IOS_CLIENT_ID" \
            --arg meta "$META_APP_ID" \
            --arg metaToken "$META_CLIENT_TOKEN" \
            '{API_BASE_URL: $api, NAVER_MAP_CLIENT_ID: $naver, KAKAO_NATIVE_APP_KEY: $kakao, GOOGLE_SERVER_CLIENT_ID: $google, GOOGLE_IOS_CLIENT_ID: $googleIos, META_APP_ID: $meta, META_CLIENT_TOKEN: $metaToken}' \
            > config/prod.json

          # Firebase(runiverse) 설정. Copy Firebase Config 빌드 단계가 여기서 집는다
          # 번들 ID가 다르면 빌드는 되지만 Firebase가 앱을 못 알아본다
          mkdir -p ios/Runner/Firebase/prod
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/Firebase/prod/GoogleService-Info.plist
          FIREBASE_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' ios/Runner/Firebase/prod/GoogleService-Info.plist)
          [ "$FIREBASE_BUNDLE_ID" = "$PACKAGE_NAME" ] || { echo "::error::Firebase 설정의 번들 ID가 $PACKAGE_NAME이 아니다 ($FIREBASE_BUNDLE_ID)"; exit 1; }

          # 배포 인증서는 이 실행에서만 쓰는 키체인에 넣는다(러너는 job이 끝나면 버려진다)
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$DIST_CERT_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" -t cert -f pkcs12 -A
          rm "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"

          # 운영 앱 App Store 배포 프로파일. Xcode가 찾는 두 자리(Xcode 16 전후)에 다 둔다
          PROFILE="$RUNNER_TEMP/prod.mobileprovision"
          echo "$PROFILE_BASE64" | base64 -d > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PROFILE" "$dir/$PROFILE_UUID.mobileprovision"
          done

          # 프로젝트는 로컬용 자동 서명이다. Runner만 읽는 xcconfig에 덧붙여 배포 인증서·프로파일로 바꾼다
          # (명령줄로 넘기면 SPM 패키지 대상까지 수동 서명이 걸려 빌드가 멈춘다)
          cat >> ios/Flutter/Release.xcconfig <<EOF

          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME
          EOF

          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

          # flutter build ipa는 .ipa로 내보내기까지만, 업로드는 아래 단계에서 API 키로 한다
          for destination in export upload; do
            cat > "$RUNNER_TEMP/ExportOptions-$destination.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$destination</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$PACKAGE_NAME</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          done

      - name: Build ipa
        run: |
          flutter build ipa --release --flavor prod \
            --build-number=${{ needs.prepare.outputs.code }} \
            --dart-define-from-file=config/prod.json \
            --export-options-plist="$RUNNER_TEMP/ExportOptions-export.plist"

      - name: 산출물 검증
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_CLIENT_TOKEN: ${{ secrets.META_CLIENT_TOKEN }}
        run: |
          set -euo pipefail
          APP="$ARCHIVE/Products/Applications/Runner.app"
          INFO="$APP/Info.plist"
          PB=/usr/libexec/PlistBuddy

          BUNDLE_ID=$($PB -c 'Print :CFBundleIdentifier' "$INFO")
          [ "$BUNDLE_ID" = "$PACKAGE_NAME" ] || { echo "::error::번들 ID가 $PACKAGE_NAME이 아니다 ($BUNDLE_ID)"; exit 1; }
          BUILD=$($PB -c 'Print :CFBundleVersion' "$INFO")
          [ "$BUILD" = "${{ needs.prepare.outputs.code }}" ] || { echo "::error::빌드 번호가 실행 번호와 다르다 ($BUILD)"; exit 1; }

          codesign -d --entitlements - --xml "$APP" > "$RUNNER_TEMP/entitlements.plist" 2>/dev/null
          grep -q 'com.apple.developer.applesignin' "$RUNNER_TEMP/entitlements.plist" || { echo "::error::애플 로그인 권한이 없다"; exit 1; }
          if grep -q '<key>get-task-allow</key><true/>' "$RUNNER_TEMP/entitlements.plist"; then echo "::error::개발 서명이다"; exit 1; fi
          # 푸시 권한이 production이 아니면 빌드는 성공해도 설치한 아이폰에 푸시가 오지 않으니 여기서 멈춘다
          APS=$($PB -c 'Print :aps-environment' "$RUNNER_TEMP/entitlements.plist" 2>/dev/null || true)
          [ "$APS" = "production" ] || { echo "::error::푸시 권한이 production이 아니다 (${APS:-없음})"; exit 1; }

          # 복귀 스킴이 없으면 빌드 단계는 경고만 남긴다. 그 로그인이 안 되니 여기서 멈춘다
          SCHEMES=$($PB -c 'Print :CFBundleURLTypes' "$INFO")
          echo "$SCHEMES" | grep -q 'kakao' || { echo "::error::카카오 복귀 스킴이 없다"; exit 1; }
          echo "$SCHEMES" | grep -q 'com.googleusercontent.apps.' || { echo "::error::구글 복귀 스킴이 없다"; exit 1; }
          [ -f "$APP/GoogleService-Info.plist" ] || { echo "::error::Firebase 설정이 앱에 없다"; exit 1; }
          # Meta 설정이 빠지면 앱은 조용히 Meta 없이 돈다. 광고 설치 측정이 꺼지니 여기서 멈춘다
          [ "$($PB -c 'Print :FacebookAppID' "$INFO")" = "$META_APP_ID" ] || { echo "::error::Meta 앱 ID가 환경 설정과 다르다"; exit 1; }
          [ "$($PB -c 'Print :FacebookClientToken' "$INFO")" = "$META_CLIENT_TOKEN" ] || { echo "::error::Meta 클라이언트 토큰이 환경 설정과 다르다"; exit 1; }
          $PB -c 'Print :NSUserTrackingUsageDescription' "$INFO" > /dev/null || { echo "::error::추적 허용 문구가 없다"; exit 1; }

          # 파일로 받아 검사한다. pipefail에서 `strings | grep -q`는 grep이 먼저 끝나 SIGPIPE(141)로 실패한다
          STRINGS="$RUNNER_TEMP/app-strings.txt"
          strings "$APP/Frameworks/App.framework/App" > "$STRINGS"
          grep -qF "$PROD_API_BASE_URL" "$STRINGS" || { echo "::error::운영 서버 주소가 앱에 없다"; exit 1; }

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # 올라가면 TestFlight가 처리한 뒤 내부 그룹(완전탐색)에 자동 배포한다. 심사 제출은 사람이 한다
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-upload.plist" \
            -exportPath "$RUNNER_TEMP/upload" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
